<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-armed Cook</title>
<link rel="icon" href="favicon.ico">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; aspect-ratio: 1280 / 720;
           width: 100%; height: auto; outline: none; }
  @media (min-aspect-ratio: 1280 / 720) { canvas { width: auto; height: 100%; } }
  #status { position: fixed; left: 16px; bottom: 12px; font: 13px system-ui, sans-serif; color: #9a9a9a; pointer-events: none; }
  #fps { position: fixed; left: 8px; top: 6px; font: 600 13px ui-monospace, Consolas, monospace; color: #e8e8e8; background: #000a;
         padding: 2px 6px; border-radius: 4px; pointer-events: none; display: none; }
</style>
</head>
<body>
<canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
<div id="status">Loading…</div>
<div id="fps"></div>
<script>
  // frame counter: Ctrl+Shift+F toggles it (remembered), ?fps=1 or ?fps=0 in the address overrides
  (() => {
    const el = document.getElementById("fps");
    let on = true;
    try { const v = localStorage.getItem("uewFps"); if (v !== null) on = v === "1"; } catch (e) {}
    const q = new URLSearchParams(location.search).get("fps");
    if (q !== null) on = q !== "0";
    const show = () => { el.style.display = on ? "block" : "none"; };
    show();
    addEventListener("keydown", e => {
      if (e.ctrlKey && e.shiftKey && e.code === "KeyF") {
        on = !on; show();
        try { localStorage.setItem("uewFps", on ? "1" : "0"); } catch (err) {}
        e.preventDefault(); e.stopImmediatePropagation();
      }
    }, true);
    let last = performance.now(), frames = 0, worst = 0, prev = 0, prevT = last;
    const tick = now => {
      const n = (window.Module && Module.uewPresents) || 0;
      if (n !== prev) { worst = Math.max(worst, now - prevT); prev = n; prevT = now; }
      if (now - last >= 500) {
        const fps = (n - frames) * 1000 / (now - last);
        if (on) el.textContent = `${fps.toFixed(0)} FPS  ${fps ? (1000 / fps).toFixed(1) : "-"} ms  worst ${worst.toFixed(0)} ms`;
        frames = n; last = now; worst = 0;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  })();
</script>
<script>
  const status = document.getElementById("status");
  const parts = ["game.wasm.0", "game.wasm.1", "game.wasm.2", "game.wasm.3", "game.wasm.4", "game.wasm.5", "game.wasm.6", "game.wasm.7", "game.wasm.8", "game.wasm.9", "game.wasm.10", "game.wasm.11", "game.wasm.12", "game.wasm.13", "game.wasm.14", "game.wasm.15", "game.wasm.16", "game.wasm.17", "game.wasm.18"];
  var Module = {
    canvas: document.getElementById("canvas"),
    arguments: ["--image", "/image.bin", "--root", "/game", "--save", "/save/OAC-Win64-Shipping", "--exe", "OAC/Binaries/Win64/OAC-Win64-Shipping.exe", "-dx11"].concat(new URLSearchParams(location.search).getAll("arg")),
    uewSave: "/save/OAC-Win64-Shipping",
    uewSeed: {"Users/Player/AppData/Local/OAC/Saved/Config/Windows/GameUserSettings.ini": "[ScalabilityGroups]\nsg.ShadowQuality=1\nsg.PostProcessQuality=0\nsg.EffectsQuality=0\nsg.FoliageQuality=0\nsg.ViewDistanceQuality=0\nsg.AntiAliasingQuality=0\nsg.ReflectionQuality=0\nsg.GlobalIlluminationQuality=0\nsg.ShadingQuality=0\nsg.LandscapeQuality=0\nsg.TextureQuality=0\n", "Users/Player/AppData/Local/OAC/Saved/Config/WindowsNoEditor/GameUserSettings.ini": "[ScalabilityGroups]\nsg.ShadowQuality=1\nsg.PostProcessQuality=0\nsg.EffectsQuality=0\nsg.FoliageQuality=0\nsg.ViewDistanceQuality=0\nsg.AntiAliasingQuality=0\nsg.ReflectionQuality=0\nsg.GlobalIlluminationQuality=0\nsg.ShadingQuality=0\nsg.LandscapeQuality=0\nsg.TextureQuality=0\n", "Users/Player/AppData/Local/OAC/Saved/Config/Windows/Scalability.ini": "[PostProcessQuality@0]\nr.EyeAdaptationQuality=2\nr.Tonemapper.Quality=5\n[PostProcessQuality@1]\nr.EyeAdaptationQuality=2\nr.Tonemapper.Quality=5\n", "Users/Player/AppData/Local/OAC/Saved/Config/WindowsNoEditor/Scalability.ini": "[PostProcessQuality@0]\nr.EyeAdaptationQuality=2\nr.Tonemapper.Quality=5\n[PostProcessQuality@1]\nr.EyeAdaptationQuality=2\nr.Tonemapper.Quality=5\n"},
    uewAsyncShaders: true,
    uewDebugPanel: true,
    uewNetPlaceholders: false,
    uewCacheMB: 682,
    uewGpuMB: 3738,
    print: t => console.log(t),
    printErr: t => console.log(t),
    setStatus: t => { if (t) status.textContent = t; },
    onRuntimeInitialized: () => { status.textContent = ""; },
  };
  if (parts.length) {
    // the parts download together and are fed in order to a streaming compile, which runs while they arrive
    Module.instantiateWasm = (imports, done) => {
      let got = 0;
      const res = parts.map(u => fetch(u));
      const body = new ReadableStream({
        async start(ctl) {
          for (let i = 0; i < res.length; i++) {
            const r = await res[i];
            if (!r.ok) throw new Error(`HTTP ${r.status} for ${parts[i]}`);
            const rd = r.body.getReader();
            for (;;) {
              const { done: end, value } = await rd.read();
              if (end) break;
              got += value.length;
              status.textContent = `Loading code ${Math.round(got / 1048576)} MB`;
              ctl.enqueue(value);
            }
          }
          status.textContent = "Compiling…";
          ctl.close();
        }
      });
      WebAssembly.instantiateStreaming(new Response(body, { headers: { "Content-Type": "application/wasm" } }), imports)
        .then(r => done(r.instance, r.module))
        .catch(e => { status.textContent = "Failed to load: " + e.message; });
      return {};
    };
  }
</script>
<script>
  // real threads: start once the page is cross-origin isolated (headers from the host, or coi-sw.js)
  if (self.crossOriginIsolated) document.write('<script src="game.js"><\/script>');
  else if (navigator.serviceWorker && window.isSecureContext) {
    status.textContent = "Setting up threads…";
    navigator.serviceWorker.register("coi-sw.js").then(() => navigator.serviceWorker.ready).then(() => {
      if (sessionStorage.getItem("uewCoi") === location.href) status.textContent = "This host blocks the isolation real threads need; rebuild with cooperative threads.";
      else { sessionStorage.setItem("uewCoi", location.href); location.reload(); }
    });
  } else status.textContent = "Real threads need https (or localhost) to run.";
</script>
</body>
</html>
